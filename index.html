<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windsurfing Spots</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Best windsurfing spots</h1>
    <form id="filters" onsubmit="return false">
      <label>Month
        <select id="month">
          <option value="">Select a month</option>
        </select>
      </label>
      <label>Continent
        <select id="continent" disabled>
          <option value="">Select a continent</option>
        </select>
      </label>
    </form>
  </header>

  <main>
    <div id="map"></div>
    <aside id="list">
      <p class="hint">Choose a month, then a continent, to see the top 10 spots. Number 1 is the best.</p>
    </aside>
  </main>

  <footer>
    Wind values are approximate long-term monthly averages, for trip planning only.
    Map data &copy; OpenStreetMap contributors.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/spots.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
